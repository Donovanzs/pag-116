<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de compañeros de aula</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Formulario de datos personales</h1>
    <p>Captura la información de tus compañeros de aula, incluyendo su fotografía.</p>

    <form id="student-form" class="card">
      <div class="field-group">
        <label for="firstName">Nombre</label>
        <input type="text" id="firstName" name="firstName" required>
      </div>

      <div class="field-group">
        <label for="lastName">Apellido</label>
        <input type="text" id="lastName" name="lastName" required>
      </div>

      <div class="field-row">
        <div class="field-group small">
          <label for="age">Edad</label>
          <input type="number" id="age" name="age" min="1" max="120" required>
        </div>
        <div class="field-group small">
          <label for="grade">Grado / Curso</label>
          <input type="text" id="grade" name="grade" required>
        </div>
      </div>

      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field-group">
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" name="phone" placeholder="Ej: 555-123-4567" required>
      </div>

      <div class="field-group">
        <label for="photo">Fotografía</label>
        <input type="file" id="photo" name="photo" accept="image/*" required>
      </div>

      <div class="photo-preview" id="photoPreview">
        <span>Vista previa de la fotografía</span>
        <img alt="Previsualización" id="previewImage" src="" hidden>
      </div>

      <button type="submit" class="btn">Guardar compañero</button>
      <button type="button" id="clearButton" class="btn secondary">Borrar registros</button>
    </form>

    <section id="studentList" class="card hidden">
      <h2>Compañero registrado</h2>
      <div class="student-card" id="studentCard"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
